<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Cliente</title>
  <link rel="stylesheet" href="styles/admin.css">
  <script>
    if (new URLSearchParams(window.location.search).has("id")) {
      document.documentElement.classList.add("carregando-edicao");
    }
  </script>
</head>

<body>

  <header class="page-header">
    <h1 id="tituloPagina">Cadastro de Cliente</h1>
    <p id="descricaoPagina">Inclua clientes para utilização nos orçamentos.</p>
  </header>

  <form id="formCliente">

    <label for="codigoCliente">Código do Cliente:</label>
    <input type="text" id="codigoCliente" readonly />

    <label for="tipoCliente">Tipo de Cliente:</label>
    <select id="tipoCliente" required>
      <option value="">Selecione</option>
      <option value="F">Físico</option>
      <option value="J">Jurídico</option>
    </select>


    <label for="cpfCnpjCliente">CPF / CNPJ:</label>
    <input type="text" id="cpfCnpjCliente" maxlength="18" required>


    <label for="nomeCliente">Nome do Cliente:</label>
    <input type="text" id="nomeCliente" maxlength="100" required>

    <label for="telefoneCliente">Telefone:</label>
    <input type="text" id="telefoneCliente" maxlength="20">

    <label for="enderecoCliente">Endereço:</label>
    <input type="text" id="enderecoCliente" maxlength="200">


    <button type="submit" id="botao">Salvar</button>
    <button type="button" id="botaoVoltarForm">Voltar</button>

  </form>

  <p id="mensagem"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/config.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/cadastrocliente.js"></script>

</body>

</html>
