<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="styles/admin.css">
    <script>
        if (new URLSearchParams(window.location.search).has("id")) {
            document.documentElement.classList.add("carregando-edicao");
        }
    </script>
</head>

<body>
    <header class="page-header">
        <h1 id="tituloPagina">Produtos</h1>
        <p id="descricaoPagina">
            Cadastre e mantenha o catálogo comercial.</p>
    </header>
    <div class="produtos">
        <form id="formProdutos">
            <label for="idProd">Código do Produto:</label>
            <input type="text" id="idProd" readonly>

            <label for="catProd">Categoria do Produto:</label>
            <input type="text" id="catProd" list="listaCategorias" placeholder="Digite para buscar a categoria..."
                autocomplete="new-off-clientes" required>
            <input type="hidden" id="catProdId">
            <datalist id="listaCategorias"></datalist>

            <label for="descProd">Descrição do Produto:</label>
            <input type="text" id="descProd" required>

            <label for="obsProd">Observação:</label>
            <textarea id="obsProd" required></textarea>

            <label for="valorVenda">Valor de Venda:</label>
            <input type="text" id="valorVenda" inputmode="decimal" placeholder="R$ 0,00" required>

            <label for="qtdEstoqueProd">Quantidade em Estoque:</label>
            <input type="number" id="qtdEstoqueProd" min="0" value="0" required>

            <label for="dataCadastroProd">Data de
                cadastro:</label><!--gerar automaticamente com data e horario que finalizar-->
            <input type="text" id="dataCadastroProd" required readonly>

            <label for="statusProd">Status do Produto:</label>
            <select id="statusProd" required>
                <option value="" disabled selected>Selecione</option>
                <option value="ATIVO">Ativo</option>
                <option value="INATIVO">Inativo</option>
            </select>
            <button type="submit" id="botao">Salvar</button>
            <button type="button" id="botaoVoltarForm">Voltar</button>
        </form>

        <p id="mensagem"></p>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="scripts/produtos.js"></script>
</body>

</html>
