<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
    <header class="page-header"><h1>Produtos</h1><p>Cadastre e mantenha o catálogo comercial.</p></header>
    <div class="produtos">
        <form id="formProdutos">
            <label for="idProd">Código do Produto:</label><!--aqui deve mostar o codigo que vai gerar no banco desse produto-->
            <input type="text" id="idProd" readonly>

            <label for="catProd">Categoria do Produto:</label>
            <select id="catProd" required>
                <option value="" disabled selected>Selecione</option>
                <!--as opções aqui embaixo são preenchidas pelo produtos.js, buscando as categorias do banco-->
            </select>

            <label for="descProd">Descrição do Produto:</label>
            <input type="text" id="descProd" required>

            <label for="obsProd">Observação:</label>
            <textarea id="obsProd" required></textarea>

            <label for="valorVenda">Valor de Venda:</label>
            <input type="number" id="valorVenda" required>

            <label for="dataCadastroProd">Data de cadastro:</label><!--gerar automaticamente com data e horario que finalizar-->
            <input type="text" id="dataCadastroProd" required readonly>

            <label for="statusProd">Status do Produto:</label>
            <select id="statusProd" required>
                <option value="" disabled selected>Selecione</option>
                <option value="ATIVO">Ativo</option>
                <option value="INATIVO">Inativo</option>
            </select>
            <button type="submit" id="botao">Salvar Produto</button>
        </form>

        <p id="mensagem"></p>

        <!--
          Listagem dos produtos já cadastrados.
          O produtos.js preenche o <tbody> com os dados do Supabase
          e coloca em cada linha os botões Editar e Excluir.
        -->
        <section class="lista-registros">
            <h3>Produtos cadastrados</h3>
            <table class="tabela-registros">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Categoria</th>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaProdutos">
                    <!-- linhas geradas pelo produtos.js -->
                </tbody>
            </table>
        </section>

    </div>

     <!--Não salvar sem categoria. 
     • Não salvar sem descrição. 
     • Não salvar sem valor de venda. 
     • Não salvar sem status. 
     • Editar deve carregar dados no
formulário. 
Na listagem, exibir botões Editar e excluir -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/produtos.js"></script>
</body>
</html>
