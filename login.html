<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login de Usuário</title>
  <link rel="stylesheet" href="styles/login.css" />
</head>

<body class="tela-login">
  <h1>
    <img class="company-logo" src="assets/logo-giro-pneus.jpg" alt="Giro Pneus — Soluções em Pneus" />
    Login do usuário
  </h1>

  <form id="formUser">
    <label for="tipoUser">Tipo de acesso:</label>
    <select id="tipoUser" required>
      <option value="">Selecione</option>
      <option value="ADMIN">Acesso Administrador</option>
      <option value="PADRAO">Acesso Padrão</option>
    </select>


    <label for="UserNome">Email:</label>
    <input type="text" id="UserNome" autocomplete="username" required />


    <label for="UserSenha">Senha:</label>
    <input type="password" id="UserSenha" maxlength="20" placeholder="Digite sua senha" autocomplete="current-password"
      required />

    <button type="submit">Entrar</button>
  </form>

  <p id="mensagem" aria-live="polite"></p>

  <!-- A biblioteca deve vir antes do arquivo login.js. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/config.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/login.js"></script>
</body>

</html>
