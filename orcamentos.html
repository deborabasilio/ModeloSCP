<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orçamentos</title>
    <link rel="stylesheet" href="styles/admin.css" />
  </head>
  <body>
    <header class="page-header"><h1>Orçamentos</h1><p>Crie e acompanhe propostas comerciais.</p></header>
    <div class="container">
      <!-- ÁREA DE VISUALIZAÇÃO / APROVAÇÃO DE UM ORÇAMENTO JÁ EXISTENTE -->
      <!-- Só aparece quando a página é aberta como orcamentos.html?id=5, -->
      <!-- o que acontece ao clicar em "Visualizar" na listagem do menu. -->
      <div id="areaVisualizacao" class="oculto">
        <div class="empty-state caixa-visualizacao-orcamento">
          <p><strong>Orçamento nº:</strong> <span id="visCodigo"></span></p>
          <p><strong>Cliente:</strong> <span id="visCliente"></span></p>
          <p><strong>Data do Orçamento:</strong> <span id="visData"></span></p>
          <p><strong>Data de Validade:</strong> <span id="visValidade"></span></p>
          <p><strong>Status Atual:</strong> <span id="visStatus"></span></p>

          <table class="tabela-registros tabela-visualizacao-orcamento">
            <thead>
              <tr><th>Produto</th><th>Qtde</th><th>Valor Unit.</th><th>Total</th></tr>
            </thead>
            <tbody id="visCorpoItens"></tbody>
          </table>

          <p class="total-visualizacao-orcamento"><strong>Valor Total do Orçamento:</strong> R$ <span id="visTotal"></span></p>

          <div id="visAcoes" class="acoes-visualizacao-orcamento">
            <button type="button" id="btnAprovarOrcamento" class="botao-secundario">Aprovar Orçamento</button>
            <button type="button" id="btnReprovarOrcamento" class="botao-secundario">Reprovar Orçamento</button>
          </div>
        </div>
      </div>

      <form id="formOrcamento">
        <label for="codigoOrcamento">Código do Orçamento:</label
        ><!--gera automaticamente buscando no banco-->
        <input type="text" id="codigoOrcamento" readonly />

        <label for="clienteSelec">Cliente selecionado:</label>
        <select id="clienteSelec" required>
          <option value="" disabled selected>Selecione</option>
          <!--as opções aqui embaixo são preenchidas pelo orcamentos.js, buscando os clientes do banco-->
        </select>

        <label for="dataOrcamento">Data do Orçamento:</label>
        <!--gera automaticamente a data e hora-->
        <input type="text" id="dataOrcamento" readonly required />

        <label for="validadeOrcamento">Data de Validade:</label>
        <input type="date" id="validadeOrcamento" required />

        <h3>Itens do Orçamento</h3>

        <label for="produtoOrc">Produto:</label>
        <select id="produtoOrc">
          <option value="" selected>Selecione um produto</option>
          <!--as opções aqui embaixo são preenchidas pelo orcamentos.js, buscando os produtos do banco-->
        </select>

        <label for="descProdutoOrc">Descrição:</label>
        <input type="text" id="descProdutoOrc" readonly>
        <!--preenchida sozinha quando o produto é selecionado-->

        <label for="qtdeProdutoOrc">Quantidade:</label>
        <input type="number" id="qtdeProdutoOrc" min="1" value="1">

        <label for="valorUnitario">Valor Unitário:</label>
        <input type="text" id="valorUnitario" readonly>
        <!--preenchido sozinho com o valor de venda do produto-->

        <label for="valorTotalItem">Valor Total do Item:</label>
        <input type="text" id="valorTotalItem" readonly>
        <!--Valor total do item = Quantidade × Valor unitário, calculado sozinho-->

        <button type="button" id="btnAdicionarItem" class="botao-secundario">Adicionar Item</button>

        <!--
          Lista dos itens que já foram adicionados neste orçamento.
          O orcamentos.js preenche essa tabela e recalcula o total
          toda vez que um item é adicionado ou removido.
        -->
        <div class="lista-itens-orcamento">
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Qtde</th>
                <th>Valor Unit.</th>
                <th>Total</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="corpoListaItens">
              <!-- linhas geradas pelo orcamentos.js -->
            </tbody>
          </table>
        </div>

        <label for="valorTotalOrcamento">Valor Total do Orçamento:</label>
        <!--soma de todos os itens adicionados, recalculada automaticamente-->
        <input type="text" id="valorTotalOrcamento" readonly value="0,00">

        <button type="submit">Salvar Orçamento</button>
      </form>

      <p id="mensagem"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/orcamentos.js"></script>
  </body>
</html>
