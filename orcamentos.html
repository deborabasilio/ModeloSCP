<!doctype html>
<html lang="pt-BR">

    <title>Orçamentos</title>

  <body>
    <header class="page-header"><h1>Orçamentos</h1><p>Crie e acompanhe propostas comerciais.</p></header>
    <div class="container">
      <form id="formOrcamento">
        <label for="codigoOrcamento">Código do Orçamento:</label
        ><!--gera automaticamente buscando no banco-->
        <input type="text" readonly />

        <label for="clienteSelec">Cliente selecionado:</label>
        <select id="clienteSelec" required>
          <option value="" disabled selected>Selecione</option>
          <option value=""></option>
          <!--busca os clientes cadastrados no banco-->
        </select>
        <label for="dataOrcamento">Data do Orçamento:</label>
        <!--gera automaticamente a data e hora-->
        <input type="datetime" readonly required />

        <label for="validadeOrcamento">Data de Validade:</label>
        <input type="date" required />

        <label for="valorTotal">Valor Total:</label>
        <!--aqui entra a função para calcular total do orçamento-->

        <h3>Itens do Orçamento</h3>

        <label for="produtoOrc">Produto(s):</label>
        <input> <!--aqui seleciona produtos-->

        <label for="descProdutoOrc">Descrição:</label>
        <input> <!--aqui seleciona descricao do produto-->

        <label for="qtdeProdutoOrc">Quantidade:</label>
        <input> <!--aqui seleciona quantidade-->

        <label for="valorUnitario">Valor Unitário:</label>
        <input> <!--aqui seleciona valor item-->

        <label for="valorTotal">Valor Total:</label>
        <input> <!--aqui entra total da qtde de itens-->
        <button type="submit">Salvar Orçamento</button>
      </form>
    </div>
    <!--Codigo do orçamento
    Cliente selecionado
    Data do orçamento
    Data de validade
    Valor total calculado-->

    produto
    descricao do produto
    quantidade
    valor unitario
    valor total do item
    
    permitir adicionar, listar e remover
    
    s totais devem ser calculados automaticamente em JavaScript. 
    Total do item

    Valor total do item = Quantidade × Valorunitário

Total do orçamento

Exemplo

• Valor unitário: R$ 50,00
• Total do item: R$ 100,00
