<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias de Produtos</title>
    <link rel="stylesheet" href="styles/admin.css">
    <script>
      if (new URLSearchParams(window.location.search).has("id")) {
        document.documentElement.classList.add("carregando-edicao");
      }
    </script>
</head>
<body>
    <header class="page-header"><h1 id="tituloPagina">Categorias</h1><p id="descricaoPagina">Organize os grupos do seu catálogo.</p></header>
    <div class="container">

      <form id="categoriaProdutos">
        <label for="codigoCategoria">Código da Categoria:</label><!--gera automaticamente mostrando o que vai receber de id no banco-->
        <input type="text" id="codigoCategoria" readonly required>

        <label for="descricaoCategoria">Descrição da Categoria:</label>
        <input type="text" id="descricaoCategoria" required>

        <button type="submit" id="botao">Salvar</button>
        <button type="button" id="botaoVoltarForm">Voltar</button>
      </form>

      <p id="mensagem"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/categoriaprodutos.js"></script>
</body>
</html>
