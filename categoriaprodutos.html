<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias de Produtos</title>
    <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
    <header class="page-header"><h1>Categorias</h1><p>Organize os grupos do seu catálogo.</p></header>
    <div class="container">

      <h3>Cadastro de Categoria de Produto</h3>

      <form id="categoriaProdutos">
        <label for="codigoCategoria">Código da Categoria</label><!--gera automaticamente mostrando o que vai receber de id no banco-->
        <input type="text" readonly required>

        <label for="descricaoCategoria">Descrição da Categoria:</label>
        <input type="text" id="descricaoCategoria" placeholder="Descreva a Categoria" required>

        <button type="submit" id="botao">Salvar Categoria</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/categoriaprodutos.js"></script>
</body>
</html>
